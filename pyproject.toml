[project]
name = "adrobot-backend"
version = "0.1.0"
description = "Backend for creating and editing Keitaro campaigns"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.9,<3",
    "pycountry>=24.6,<27",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adrobot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
